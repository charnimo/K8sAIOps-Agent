---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-monitor
  namespace: aiops-system
  labels:
    app.kubernetes.io/name: aiops-monitor
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-monitor
  template:
    metadata:
      labels:
        app: aiops-monitor
        app.kubernetes.io/name: aiops-monitor
    spec:
      serviceAccountName: aiops-monitor-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: aiops-monitor
          image: dou3a2/aiops-monitor:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: websocket
              protocol: TCP
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: INFO
            - name: WS_PORT
              value: "8765"
            - name: HTTP_PORT
              value: "8080"
            - name: BACKEND_API_URL
              value: "http://aiops-backend.aiops-system.svc.cluster.local:8000"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/aiops
            - name: service-account-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /monitor/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /monitor/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config-volume
          configMap:
            name: aiops-monitor-config
        - name: service-account-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-monitor-svc
  namespace: aiops-system
  labels:
    app.kubernetes.io/name: aiops-monitor
spec:
  selector:
    app: aiops-monitor
  ports:
    - name: websocket
      port: 8765
      targetPort: 8765
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

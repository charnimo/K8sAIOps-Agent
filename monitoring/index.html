<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIOps · Kubernetes Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #050810;
    --surface:     #0c1020;
    --surface2:    #111827;
    --border:      #1e2d45;
    --border2:     #243352;
    --text:        #c8d8f0;
    --text-dim:    #4a6080;
    --text-muted:  #2a3a55;
    --accent:      #00d4ff;
    --accent-dim:  #005f73;
    --green:       #00ff9d;
    --green-dim:   #003d26;
    --yellow:      #ffd700;
    --yellow-dim:  #3d3200;
    --red:         #ff4466;
    --red-dim:     #3d0016;
    --purple:      #a855f7;
    --purple-dim:  #2d0a4e;
    --mono:        'JetBrains Mono', monospace;
    --sans:        'Syne', sans-serif;
  }

  html, body {
    height: 100%; background: var(--bg);
    color: var(--text); font-family: var(--mono);
    font-size: 13px; overflow: hidden;
  }

  /* ── Layout ─────────────────────────────────────────────── */
  .shell {
    display: grid;
    grid-template-rows: 52px 1fr;
    grid-template-columns: 260px 1fr 300px;
    height: 100vh;
    gap: 1px;
    background: var(--border);
  }

  .topbar {
    grid-column: 1 / -1;
    background: var(--surface);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar   { background: var(--surface); overflow-y: auto; }
  .main      { background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
  .rightpane { background: var(--surface); overflow-y: auto; }

  /* ── Topbar ─────────────────────────────────────────────── */
  .logo {
    font-family: var(--sans); font-size: 18px; font-weight: 800;
    color: var(--accent); letter-spacing: -0.5px; flex-shrink: 0;
  }
  .logo span { color: var(--text-dim); }

  .topbar-cluster {
    font-size: 11px; color: var(--text-dim);
    border: 1px solid var(--border2); padding: 3px 10px;
    border-radius: 4px; background: var(--surface2);
  }

  .topbar-stats {
    display: flex; gap: 20px; margin-left: auto;
    font-size: 11px;
  }
  .topbar-stat { display: flex; flex-direction: column; align-items: flex-end; }
  .topbar-stat .val { font-size: 18px; font-weight: 600; line-height: 1; }
  .topbar-stat .lbl { color: var(--text-dim); font-size: 10px; }
  .topbar-stat.crit .val { color: var(--red); }
  .topbar-stat.warn .val { color: var(--yellow); }
  .topbar-stat.info .val { color: var(--green); }

  .ws-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--text-dim);
    padding: 4px 10px; border-radius: 4px;
    border: 1px solid var(--border);
    margin-left: 12px;
  }
  .ws-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
  }
  .ws-dot.connected  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .ws-dot.connecting { background: var(--yellow); animation: blink 1s infinite; }
  .ws-dot.error      { background: var(--red); }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── Sidebar – Subscription ─────────────────────────────── */
  .panel-title {
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); padding: 14px 16px 8px;
    border-bottom: 1px solid var(--border);
  }

  .sub-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .sub-label { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 1px; }

  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-group input, .field-group select {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 11px;
    padding: 5px 8px; border-radius: 3px; outline: none;
    transition: border-color 0.2s;
  }
  .field-group input:focus, .field-group select:focus {
    border-color: var(--accent);
  }

  .checkbox-group { display: flex; flex-direction: column; gap: 4px; }
  .checkbox-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; cursor: pointer; padding: 2px 0;
  }
  .checkbox-item input[type=checkbox] { accent-color: var(--accent); }

  .tag-input {
    display: flex; flex-wrap: wrap; gap: 4px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 8px; min-height: 34px;
    cursor: text;
  }
  .tag {
    background: var(--accent-dim); color: var(--accent);
    border-radius: 3px; padding: 1px 6px; font-size: 10px;
    display: flex; align-items: center; gap: 4px;
  }
  .tag .rm { cursor: pointer; opacity: 0.6; }
  .tag .rm:hover { opacity: 1; }
  .tag-input-field {
    background: none; border: none; outline: none;
    color: var(--text); font-family: var(--mono);
    font-size: 11px; min-width: 80px; flex: 1;
  }

  .btn {
    width: 100%; padding: 7px; border: none; border-radius: 3px;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
  }
  .btn-primary {
    background: var(--accent); color: var(--bg);
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Sidebar – Namespace tree ───────────────────────────── */
  .ns-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 16px; font-size: 11px; cursor: pointer;
    color: var(--text-dim);
    transition: background 0.15s;
  }
  .ns-item:hover { background: var(--surface2); color: var(--text); }
  .ns-item .ns-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .ns-item .ns-count { margin-left: auto; font-size: 10px; }
  .ns-item.active { color: var(--accent); }
  .ns-item.active .ns-dot { background: var(--accent); }

  /* ── Main – Event feed ──────────────────────────────────── */
  .feed-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .filter-btn {
    padding: 3px 10px; border-radius: 3px; font-size: 10px;
    font-family: var(--mono); cursor: pointer; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim);
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .filter-btn.active-crit { border-color: var(--red);    color: var(--red);    background: var(--red-dim); }
  .filter-btn.active-warn { border-color: var(--yellow); color: var(--yellow); background: var(--yellow-dim); }
  .filter-btn.active-info { border-color: var(--green);  color: var(--green);  background: var(--green-dim); }
  .filter-btn.active-all  { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .feed-search {
    margin-left: auto; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 11px;
    padding: 4px 10px; border-radius: 3px; outline: none; width: 180px;
  }
  .feed-search:focus { border-color: var(--accent); }

  .feed { flex: 1; overflow-y: auto; padding: 8px 0; }

  .event-card {
    border-left: 3px solid var(--border);
    margin: 3px 12px; padding: 9px 12px;
    border-radius: 0 4px 4px 0;
    background: var(--surface);
    cursor: pointer;
    transition: all 0.15s;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .event-card:hover { background: var(--surface2); }
  .event-card.CRITICAL { border-left-color: var(--red); }
  .event-card.WARNING  { border-left-color: var(--yellow); }
  .event-card.INFO     { border-left-color: var(--green); }
  .event-card.selected { background: var(--surface2); outline: 1px solid var(--accent-dim); }

  .event-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
  }
  .severity-badge {
    font-size: 9px; font-weight: 700; letter-spacing: 1px;
    padding: 1px 6px; border-radius: 2px;
  }
  .sev-CRITICAL { background: var(--red-dim);    color: var(--red); }
  .sev-WARNING  { background: var(--yellow-dim); color: var(--yellow); }
  .sev-INFO     { background: var(--green-dim);  color: var(--green); }

  .event-type {
    font-size: 10px; color: var(--purple); font-weight: 600;
  }
  .event-time {
    margin-left: auto; font-size: 10px; color: var(--text-dim);
  }

  .event-resource {
    font-size: 12px; color: var(--text); margin-bottom: 3px;
    font-weight: 500;
  }
  .event-resource .ns { color: var(--accent-dim); margin-right: 4px; }
  .event-message { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
  .event-teams { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
  .team-chip {
    font-size: 9px; padding: 1px 6px; border-radius: 2px;
    background: var(--purple-dim); color: var(--purple);
  }

  /* ── Right pane – Detail view ───────────────────────────── */
  .detail-empty {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: var(--text-muted); font-size: 11px;
    flex-direction: column; gap: 8px;
  }
  .detail-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .detail-kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .kv-row { display: contents; }
  .kv-key { font-size: 10px; color: var(--text-dim); }
  .kv-val { font-size: 11px; color: var(--text); word-break: break-all; }
  .kv-val.red    { color: var(--red); }
  .kv-val.yellow { color: var(--yellow); }
  .kv-val.green  { color: var(--green); }

  .labels-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .label-chip {
    font-size: 10px; padding: 2px 7px; border-radius: 3px;
    background: var(--surface2); color: var(--text-dim);
    border: 1px solid var(--border);
  }

  /* ── Scrollbar ──────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── Connection modal ───────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,8,16,0.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 6px; padding: 28px; width: 380px;
    font-family: var(--mono);
  }
  .modal h2 {
    font-family: var(--sans); font-size: 20px; font-weight: 700;
    color: var(--accent); margin-bottom: 4px;
  }
  .modal p { font-size: 11px; color: var(--text-dim); margin-bottom: 20px; }
  .modal label { display: block; font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
  .modal input, .modal select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 7px 10px; border-radius: 4px; outline: none; margin-bottom: 12px;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; }

  /* ── Pulse ring on new critical ─────────────────────────── */
  @keyframes pulseRing {
    0%   { box-shadow: 0 0 0 0 rgba(255,68,102,0.4); }
    70%  { box-shadow: 0 0 0 10px rgba(255,68,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,68,102,0); }
  }
  .pulse { animation: pulseRing 1s ease; }
</style>
</head>
<body>

<!-- Connection Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>AIOps Monitor</h2>
    <p>Connect to the WebSocket notification server to start receiving real-time Kubernetes events.</p>
    <label>WebSocket URL</label>
    <input type="text" id="wsUrl" value="ws://localhost:8765" placeholder="ws://aiops-monitor:8765">
    <label>User ID</label>
    <input type="text" id="userId" value="ops-engineer-1" placeholder="your-user-id">
    <label>Role</label>
    <select id="userRole">
      <option value="viewer">Viewer</option>
      <option value="operator" selected>Operator</option>
      <option value="admin">Admin</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="connect()">Connect</button>
      <button class="btn btn-ghost" onclick="connectDemo()">Demo Mode</button>
    </div>
  </div>
</div>

<!-- Main Shell -->
<div class="shell">

  <!-- Topbar -->
  <header class="topbar">
    <div class="logo">AIOps<span>·</span>Monitor</div>
    <div class="topbar-cluster" id="clusterLabel">cluster: —</div>
    <div class="ws-badge">
      <div class="ws-dot" id="wsDot"></div>
      <span id="wsStatus">Disconnected</span>
    </div>
    <div class="topbar-stats">
      <div class="topbar-stat crit">
        <span class="val" id="statCrit">0</span>
        <span class="lbl">CRITICAL</span>
      </div>
      <div class="topbar-stat warn">
        <span class="val" id="statWarn">0</span>
        <span class="lbl">WARNING</span>
      </div>
      <div class="topbar-stat info">
        <span class="val" id="statInfo">0</span>
        <span class="lbl">INFO</span>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="panel-title">Subscription</div>

    <div class="sub-section">
      <div class="sub-label">Namespaces</div>
      <div class="tag-input" id="nsTagInput" onclick="document.getElementById('nsField').focus()">
        <input class="tag-input-field" id="nsField" placeholder="add namespace…" onkeydown="addTag(event,'ns')">
      </div>
    </div>

    <div class="sub-section">
      <div class="sub-label">Teams</div>
      <div class="tag-input" id="teamTagInput" onclick="document.getElementById('teamField').focus()">
        <input class="tag-input-field" id="teamField" placeholder="add team…" onkeydown="addTag(event,'team')">
      </div>
    </div>

    <div class="sub-section">
      <div class="sub-label">Severity</div>
      <div class="checkbox-group">
        <label class="checkbox-item">
          <input type="checkbox" id="sev-CRITICAL" checked> <span style="color:var(--red)">● CRITICAL</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="sev-WARNING" checked> <span style="color:var(--yellow)">● WARNING</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="sev-INFO" checked> <span style="color:var(--green)">● INFO</span>
        </label>
      </div>
    </div>

    <div class="sub-section">
      <button class="btn btn-primary" onclick="updateSubscription()">Apply Filters</button>
    </div>

    <div class="panel-title" style="margin-top:8px">Namespaces Seen</div>
    <div id="nsList"></div>
  </aside>

  <!-- Main feed -->
  <main class="main">
    <div class="feed-toolbar">
      <button class="filter-btn active-all" data-filter="ALL" onclick="setFilter(this)">All</button>
      <button class="filter-btn" data-filter="CRITICAL" onclick="setFilter(this)">Critical</button>
      <button class="filter-btn" data-filter="WARNING" onclick="setFilter(this)">Warning</button>
      <button class="filter-btn" data-filter="INFO" onclick="setFilter(this)">Info</button>
      <button class="filter-btn" onclick="clearFeed()" style="margin-left:4px">Clear</button>
      <input class="feed-search" placeholder="Search events…" oninput="applySearch(this.value)" id="searchInput">
    </div>
    <div class="feed" id="feed">
      <div class="detail-empty">
        <div style="font-size:24px">⬡</div>
        <div>Waiting for events…</div>
      </div>
    </div>
  </main>

  <!-- Right pane – detail -->
  <aside class="rightpane">
    <div class="panel-title">Event Detail</div>
    <div id="detailPane">
      <div class="detail-empty">
        <div style="font-size:24px">◈</div>
        <div>Select an event</div>
      </div>
    </div>
  </aside>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let ws = null;
let events = [];           // all received events
let selectedId = null;
let filterLevel = 'ALL';
let searchQuery = '';
let nsTags  = new Set();
let teamTags = new Set();
let nsSeen  = {};          // namespace → count
let demoMode = false;

const stats = { CRITICAL: 0, WARNING: 0, INFO: 0 };

// ── WebSocket connection ───────────────────────────────────────────────────
function setWsStatus(state) {
  const dot = document.getElementById('wsDot');
  const lbl = document.getElementById('wsStatus');
  dot.className = 'ws-dot ' + state;
  const labels = { connected:'Connected', connecting:'Connecting…', error:'Error', '':'Disconnected' };
  lbl.textContent = labels[state] || 'Disconnected';
}

function connect() {
  const url    = document.getElementById('wsUrl').value.trim();
  const userId = document.getElementById('userId').value.trim() || 'anonymous';
  const role   = document.getElementById('userRole').value;
  document.getElementById('modal').style.display = 'none';
  document.getElementById('clusterLabel').textContent = 'cluster: ' + new URL(url.replace('ws','http')).hostname;
  doConnect(url, userId, role);
}

function doConnect(url, userId, role) {
  setWsStatus('connecting');
  ws = new WebSocket(url);

  ws.onopen = () => {
    setWsStatus('connected');
    const sub = {
      user_id: userId, role,
      namespaces: [...nsTags],
      teams: [...teamTags],
      severities: getSelectedSeverities(),
    };
    ws.send(JSON.stringify(sub));
  };

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'SUBSCRIBED') {
      if (msg.history) msg.history.forEach(ingestEvent);
    } else if (msg.type === 'HISTORY') {
      msg.events.forEach(ingestEvent);
    } else if (msg.type === 'PONG') {
      // heartbeat ok
    } else {
      // It's a raw EnrichedEvent
      ingestEvent(msg);
    }
  };

  ws.onerror = () => setWsStatus('error');
  ws.onclose = () => {
    setWsStatus('');
    setTimeout(() => doConnect(url, userId, role), 5000);
  };

  // Heartbeat
  setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'PING'})); }, 30000);
}

function updateSubscription() {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({
    type: 'UPDATE_SUBSCRIPTION',
    namespaces: [...nsTags],
    teams: [...teamTags],
    severities: getSelectedSeverities(),
  }));
}

function getSelectedSeverities() {
  return ['CRITICAL','WARNING','INFO'].filter(s => document.getElementById('sev-'+s).checked);
}

// ── Demo mode ──────────────────────────────────────────────────────────────
const DEMO_EVENTS = [
  { event_type:'POD_FAILURE',      severity:'CRITICAL', namespace:'production', resource_name:'api-server-7d9f-xkb2p', resource_kind:'Pod',  reason:'CrashLoopBackOff',  message:'Back-off restarting failed container api-server in pod api-server-7d9f-xkb2p', teams:['ops-team','sre-team'], node:'node-01', labels:{app:'api-server',team:'ops-team'}, annotations:{} },
  { event_type:'IMAGE_PULL_ERROR', severity:'CRITICAL', namespace:'staging',    resource_name:'frontend-5c7b-j9p4q',  resource_kind:'Pod',  reason:'ImagePullBackOff',  message:'Failed to pull image "registry.io/frontend:v2.3.1-rc.4": not found',           teams:['dev-team','qa-team'],  node:'node-02', labels:{app:'frontend'}, annotations:{} },
  { event_type:'SCHEDULING_ISSUE', severity:'WARNING',  namespace:'production', resource_name:'worker-deploy',        resource_kind:'Pod',  reason:'FailedScheduling',  message:'0/3 nodes are available: 3 Insufficient memory.',                                  teams:['ops-team','sre-team'], node:null,       labels:{}, annotations:{} },
  { event_type:'OOM_KILLED',       severity:'CRITICAL', namespace:'production', resource_name:'ml-inference-9k2x',   resource_kind:'Pod',  reason:'OOMKilled',         message:'Container ml-inference exceeded memory limit of 2Gi',                              teams:['ops-team'],            node:'node-03', labels:{team:'ml-team'}, annotations:{} },
  { event_type:'GENERIC_WARNING',  severity:'WARNING',  namespace:'kube-system',resource_name:'coredns-787d4945fb-r', resource_kind:'Pod',  reason:'Unhealthy',         message:'Readiness probe failed: connection refused',                                       teams:['platform-team'],       node:'node-01', labels:{}, annotations:{} },
  { event_type:'GENERIC_INFO',     severity:'INFO',     namespace:'development',resource_name:'test-api-v2-rc1',      resource_kind:'Pod',  reason:'Started',           message:'Started container test-api',                                                       teams:['dev-team'],            node:'node-02', labels:{}, annotations:{} },
  { event_type:'POD_RESTART',      severity:'WARNING',  namespace:'staging',    resource_name:'db-migrate-job-5b9',   resource_kind:'Pod',  reason:'BackOff',           message:'Back-off restarting failed container db-migrate',                                  teams:['dev-team','qa-team'],  node:'node-02', labels:{}, annotations:{} },
  { event_type:'NAMESPACE_EVENT',  severity:'WARNING',  namespace:'old-feature', resource_name:'old-feature',        resource_kind:'Namespace', reason:'Terminating', message:'Namespace old-feature is being deleted',                                           teams:['ops-team'],            node:null,       labels:{}, annotations:{} },
];

function connectDemo() {
  demoMode = true;
  document.getElementById('modal').style.display = 'none';
  document.getElementById('clusterLabel').textContent = 'cluster: demo-cluster (simulated)';
  setWsStatus('connected');

  let i = 0;
  function emitNext() {
    const base = DEMO_EVENTS[i % DEMO_EVENTS.length];
    const evt = {
      ...base,
      event_id: 'demo-' + Date.now(),
      timestamp: new Date().toISOString(),
      raw_count: 1,
    };
    ingestEvent(evt);
    i++;
    setTimeout(emitNext, 1500 + Math.random() * 3000);
  }
  // Emit a few immediately
  setTimeout(emitNext, 400);
}

// ── Event ingestion ────────────────────────────────────────────────────────
function ingestEvent(evt) {
  events.unshift(evt);
  if (events.length > 500) events.pop();

  stats[evt.severity] = (stats[evt.severity] || 0) + 1;
  document.getElementById('statCrit').textContent = stats.CRITICAL;
  document.getElementById('statWarn').textContent = stats.WARNING;
  document.getElementById('statInfo').textContent = stats.INFO;

  // Namespace tracking
  nsSeen[evt.namespace] = (nsSeen[evt.namespace] || 0) + 1;
  renderNsList();

  renderFeed();

  if (evt.severity === 'CRITICAL') {
    document.title = '🔴 ' + evt.reason + ' | AIOps Monitor';
    setTimeout(() => document.title = 'AIOps · Kubernetes Monitor', 5000);
  }
}

// ── Rendering ──────────────────────────────────────────────────────────────
function timeAgo(ts) {
  const sec = Math.floor((Date.now() - new Date(ts)) / 1000);
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.floor(sec/60) + 'm ago';
  return Math.floor(sec/3600) + 'h ago';
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const filtered = events.filter(e => {
    if (filterLevel !== 'ALL' && e.severity !== filterLevel) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return (e.resource_name||'').toLowerCase().includes(q) ||
             (e.namespace||'').toLowerCase().includes(q) ||
             (e.message||'').toLowerCase().includes(q) ||
             (e.reason||'').toLowerCase().includes(q);
    }
    return true;
  });

  if (filtered.length === 0) {
    feed.innerHTML = `<div class="detail-empty"><div style="font-size:24px">⬡</div><div>No events match your filter</div></div>`;
    return;
  }

  feed.innerHTML = filtered.map(e => `
    <div class="event-card ${e.severity} ${e.event_id === selectedId ? 'selected' : ''}"
         onclick="selectEvent('${e.event_id}')">
      <div class="event-header">
        <span class="severity-badge sev-${e.severity}">${e.severity}</span>
        <span class="event-type">${e.event_type}</span>
        <span class="event-time">${timeAgo(e.timestamp)}</span>
      </div>
      <div class="event-resource">
        <span class="ns">${e.namespace}/</span>${e.resource_name}
      </div>
      <div class="event-message">${truncate(e.message, 90)}</div>
      ${e.teams.length ? `<div class="event-teams">${e.teams.map(t=>`<span class="team-chip">${t}</span>`).join('')}</div>` : ''}
    </div>
  `).join('');
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n) + '…' : str;
}

function selectEvent(id) {
  selectedId = id;
  const evt = events.find(e => e.event_id === id);
  if (!evt) return;
  renderFeed();
  renderDetail(evt);
}

function renderDetail(e) {
  const colorMap = { CRITICAL:'red', WARNING:'yellow', INFO:'green' };
  const c = colorMap[e.severity] || '';
  const labelChips = Object.entries({ ...e.labels, ...e.annotations })
    .filter(([k]) => !k.startsWith('kubectl.kubernetes.io'))
    .map(([k,v]) => `<span class="label-chip">${k}=${v}</span>`).join('');

  document.getElementById('detailPane').innerHTML = `
    <div class="detail-section">
      <div class="detail-kv">
        <span class="kv-key">Event ID</span>   <span class="kv-val" style="font-size:10px">${e.event_id}</span>
        <span class="kv-key">Severity</span>   <span class="kv-val ${c}">${e.severity}</span>
        <span class="kv-key">Type</span>        <span class="kv-val" style="color:var(--purple)">${e.event_type}</span>
        <span class="kv-key">Reason</span>      <span class="kv-val ${c}">${e.reason}</span>
        <span class="kv-key">Namespace</span>   <span class="kv-val" style="color:var(--accent)">${e.namespace}</span>
        <span class="kv-key">Resource</span>    <span class="kv-val">${e.resource_name}</span>
        <span class="kv-key">Kind</span>         <span class="kv-val">${e.resource_kind}</span>
        <span class="kv-key">Node</span>         <span class="kv-val">${e.node || '—'}</span>
        <span class="kv-key">Count</span>        <span class="kv-val">${e.raw_count || 1}</span>
        <span class="kv-key">Timestamp</span>   <span class="kv-val" style="font-size:10px">${new Date(e.timestamp).toLocaleString()}</span>
      </div>
    </div>
    <div class="detail-section">
      <div class="sub-label" style="margin-bottom:6px">Message</div>
      <div style="font-size:11px; color:var(--text); line-height:1.6">${e.message}</div>
    </div>
    ${e.teams.length ? `
    <div class="detail-section">
      <div class="sub-label" style="margin-bottom:6px">Routed Teams</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${e.teams.map(t=>`<span class="team-chip" style="font-size:10px;padding:3px 8px">${t}</span>`).join('')}</div>
    </div>` : ''}
    ${labelChips ? `
    <div class="detail-section">
      <div class="sub-label" style="margin-bottom:6px">Labels & Annotations</div>
      <div class="labels-list">${labelChips}</div>
    </div>` : ''}
  `;
}

function renderNsList() {
  const sorted = Object.entries(nsSeen).sort((a,b) => b[1]-a[1]);
  document.getElementById('nsList').innerHTML = sorted.map(([ns, cnt]) => `
    <div class="ns-item" onclick="filterByNs('${ns}')">
      <div class="ns-dot"></div>
      <span>${ns}</span>
      <span class="ns-count" style="color:var(--text-dim)">${cnt}</span>
    </div>
  `).join('');
}

function filterByNs(ns) {
  searchQuery = ns;
  document.getElementById('searchInput').value = ns;
  renderFeed();
}

// ── Filter controls ────────────────────────────────────────────────────────
function setFilter(btn) {
  filterLevel = btn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn';
    if (b === btn) {
      const cls = { ALL:'active-all', CRITICAL:'active-crit', WARNING:'active-warn', INFO:'active-info' };
      b.classList.add(cls[filterLevel] || 'active-all');
    }
  });
  renderFeed();
}

function applySearch(val) {
  searchQuery = val;
  renderFeed();
}

function clearFeed() {
  events = [];
  stats.CRITICAL = stats.WARNING = stats.INFO = 0;
  ['statCrit','statWarn','statInfo'].forEach(id => document.getElementById(id).textContent = '0');
  selectedId = null;
  nsSeen = {};
  renderNsList();
  renderFeed();
  document.getElementById('detailPane').innerHTML = `<div class="detail-empty"><div style="font-size:24px">◈</div><div>Select an event</div></div>`;
}

// ── Tag inputs ─────────────────────────────────────────────────────────────
function addTag(evt, type) {
  if (evt.key !== 'Enter') return;
  const field = evt.target;
  const val = field.value.trim();
  if (!val) return;
  field.value = '';
  const set = type === 'ns' ? nsTags : teamTags;
  const containerId = type === 'ns' ? 'nsTagInput' : 'teamTagInput';
  set.add(val);
  renderTags(containerId, set, type, field);
}

function renderTags(containerId, set, type, inputEl) {
  const container = document.getElementById(containerId);
  const existing = [...container.querySelectorAll('.tag')];
  existing.forEach(t => t.remove());
  [...set].forEach(val => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.innerHTML = `${val}<span class="rm" onclick="removeTag('${val}','${type}','${containerId}')">×</span>`;
    container.insertBefore(tag, inputEl);
  });
}

function removeTag(val, type, containerId) {
  const set = type === 'ns' ? nsTags : teamTags;
  set.delete(val);
  const field = document.getElementById(type === 'ns' ? 'nsField' : 'teamField');
  renderTags(containerId, set, type, field);
}
</script>
</body>
</html>

<style>
	.evnt-container { display: flex; flex-direction: column; height: 100%; gap: 16px; padding: 20px; background-color: #0b0f19; }
	.evnt-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
	.evnt-header h2 { font-size: 20px; font-weight: 800; color: #fff; margin: 0; letter-spacing: -0.5px; }
	.evnt-ws-badge { display: flex; align-items: center; gap: 8px; font-size: 11px; background: rgba(15, 23, 42, 0.4); padding: 6px 12px; border-radius: 6px; border: 1px solid #1e293b; color: #94a3b8; }
	.evnt-ws-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; transition: background 0.3s; }
	.evnt-ws-dot.connected { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
	.evnt-ws-dot.error { background: #ef4444; }
	.evnt-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
	.evnt-stat-card { background: #111827; border-radius: 8px; border: 1px solid #1e293b; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
	.evnt-stat-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
	.evnt-stat-value { font-size: 24px; font-weight: 800; }
	.evnt-stat-crit .evnt-stat-value { color: #f43f5e; }
	.evnt-stat-warn .evnt-stat-value { color: #fbbf24; }
	.evnt-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
	.evnt-filter-btn { padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; border: 1px solid #1e293b; background: transparent; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
	.evnt-filter-btn:hover { border-color: #334155; color: #cbd5e1; }
	.evnt-filter-btn.active { border-color: #06b6d4; color: #22d3ee; background: rgba(6, 182, 212, 0.12); }
	.evnt-toggle-info { margin-left: 8px; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; border: 1px solid #1e293b; background: rgba(15, 23, 42, 0.5); color: #64748b; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
	.evnt-toggle-info.active { border-color: #3b82f6; color: #60a5fa; background: rgba(59, 130, 246, 0.1); }
	.evnt-search { margin-left: auto; background: #090d16; border: 1px solid #1e293b; color: #e2e8f0; font-size: 12px; padding: 6px 12px; border-radius: 6px; outline: none; min-width: 220px; }
	.evnt-search:focus { border-color: #06b6d4; }
	
	.evnt-grid { display: grid; grid-template-columns: 440px 1fr; gap: 20px; flex: 1; min-height: 0; }
	.evnt-panel { background: #111827; border-radius: 8px; border: 1px solid #1e293b; overflow: hidden; display: flex; flex-direction: column; }
	.evnt-panel-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #64748b; padding: 12px 16px; border-bottom: 1px solid #1e293b; background: #090d16; text-transform: uppercase; }
	.evnt-feed { flex: 1; overflow-y: auto; }
	.evnt-feed-empty { padding: 32px 16px; text-align: center; color: #64748b; font-size: 13px; }
	.evnt-event { padding: 14px 16px; border-bottom: 1px solid #1e293b; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 8px; position: relative; }
	.evnt-event:hover { background: rgba(30, 41, 59, 0.15); }
	.evnt-event.selected { background: rgba(6, 182, 212, 0.05); }
	.evnt-event.checked { opacity: 0.65; }
	.evnt-unread-dot { width: 6px; height: 6px; border-radius: 50%; background: #06b6d4; box-shadow: 0 0 6px #06b6d4; position: absolute; left: 6px; top: 20px; display: none; }
	.evnt-event:not(.checked) .evnt-unread-dot { display: block; animation: pulse-dot 2s infinite; }
	@keyframes pulse-dot { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 5px rgba(6, 182, 212, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); } }

	.evnt-event-header { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
	.evnt-severity { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px; text-transform: uppercase; }
	.evnt-sev-CRITICAL { background: rgba(244, 63, 94, 0.1); color: #fb7185; }
	.evnt-sev-WARNING { background: rgba(251, 191, 36, 0.1); color: #fcd34d; }
	.evnt-sev-INFO { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
	.evnt-event-time { font-size: 10px; color: #475569; }
	.evnt-event-resource { font-size: 12px; color: #e2e8f0; font-weight: 700; padding-right: 20px; }
	.evnt-event-ns { color: #06b6d4; margin-right: 2px; }
	.evnt-event-message { font-size: 11px; color: #64748b; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

	.evnt-card-actions { display: flex; gap: 8px; margin-top: 4px; }
	.evnt-btn-raw { font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: rgba(30, 41, 59, 0.8); color: #94a3b8; border: 1px solid #334155; transition: all 0.2s; }
	.evnt-btn-raw:hover { background: #334155; color: #cbd5e1; }
	.evnt-event.selected-raw .evnt-btn-raw { background: #334155; color: #fff; border-color: #475569; }

	.evnt-btn-ai { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; background: rgba(6, 182, 212, 0.1); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
	.evnt-btn-ai:hover { background: rgba(6, 182, 212, 0.2); }
	.evnt-event.selected-ai .evnt-btn-ai { background: rgba(6, 182, 212, 0.25); border-color: #06b6d4; color: #fff; box-shadow: 0 0 8px rgba(6, 182, 212, 0.3); }

	.evnt-delete-btn { position: absolute; right: 14px; bottom: 12px; color: #475569; background: transparent; border: none; cursor: pointer; padding: 4px; border-radius: 4px; opacity: 0; transition: all 0.15s; }
	.evnt-event:hover .evnt-delete-btn { position: absolute; right: 14px; bottom: 12px; color: #475569; background: transparent; border: none; cursor: pointer; padding: 4px; border-radius: 4px; opacity: 0; transition: all 0.15s; }
	.evnt-delete-btn:hover { color: #f43f5e; background: rgba(244, 63, 94, 0.1); }

	.evnt-detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #475569; gap: 8px; padding: 48px; text-align: center; }
	.evnt-detail-body { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 24px; }
	.evnt-section-title { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #1e293b; padding-bottom: 6px; margin-bottom: 12px; }
	.evnt-diagnostics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
	.evnt-diag-card { background: #090d16; border: 1px solid #1e293b; padding: 8px 10px; border-radius: 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
	.evnt-diag-name { font-weight: 600; color: #cbd5e1; }
	.evnt-diag-status { font-weight: 800; text-transform: uppercase; font-size: 9px; }
	.evnt-remediation-step { background: #090d16; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; display: flex; gap: 12px; }
	.evnt-step-number { background: rgba(34, 211, 238, 0.08); color: #22d3ee; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; flex-shrink: 0; }
	.evnt-log-snapshot { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 11px; color: #94a3b8; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; }
	.evnt-confidence-bar { height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; width: 80px; display: inline-block; vertical-align: middle; margin-left: 6px; }
	.evnt-confidence-fill { height: 100%; background: #06b6d4; }


	.raw-event-item { background: #090d16; border: 1px solid #1e293b; padding: 12px; border-radius: 6px; margin-bottom: 8px; }
	.raw-event-reason { font-size: 11px; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; display: flex; justify-content: space-between; }
	.raw-event-msg { font-size: 11px; color: #94a3b8; line-height: 1.5; }

	.evnt-kv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: #090d16; border: 1px solid #1e293b; border-radius: 6px; padding: 16px; margin-bottom: 24px; }
	.evnt-kv-item { display: flex; flex-direction: column; gap: 4px; }
	.evnt-kv-key { font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
	.evnt-kv-val { font-size: 12px; color: #e2e8f0; word-break: break-all; }
</style>

<div class="evnt-container">
	<div class="evnt-header">
		<h2>Automated Diagnosis & Incidents</h2>
		<div class="evnt-ws-badge">
			<div class="evnt-ws-dot" id="evntWsDot"></div>
			<span id="evntWsStatus">Disconnected</span>
		</div>
	</div>

	<div class="evnt-stats">
		<div class="evnt-stat-card evnt-stat-crit">
			<span class="evnt-stat-label">Critical</span>
			<span class="evnt-stat-value" id="evntStatCrit">0</span>
		</div>
		<div class="evnt-stat-card evnt-stat-warn">
			<span class="evnt-stat-label">Warning</span>
			<span class="evnt-stat-value" id="evntStatWarn">0</span>
		</div>
	</div>

	<div class="evnt-toolbar">
		<button class="evnt-filter-btn active" data-filter="ALL" onclick="window.evntCtrl.setFilter('ALL', this)">All</button>
		<button class="evnt-filter-btn" data-filter="CRITICAL" onclick="window.evntCtrl.setFilter('CRITICAL', this)">Critical</button>
		<button class="evnt-filter-btn" data-filter="WARNING" onclick="window.evntCtrl.setFilter('WARNING', this)">Warning</button>
		
		<button id="btnToggleInfo" class="evnt-toggle-info" onclick="window.evntCtrl.toggleInfo()">
			<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
			Show INFO
		</button>
		
		<button class="evnt-filter-btn" onclick="window.evntCtrl.clearAll()" style="margin-left:auto; margin-right:8px;">Clear All</button>
		<input type="text" class="evnt-search" placeholder="Search incidents…" oninput="window.evntCtrl.setSearch(this.value)" id="evntSearch">
	</div>

	<div class="evnt-grid">
		<div class="evnt-panel">
			<div class="evnt-panel-header">
				<span>Incident List</span>
				<span class="text-[9px] font-normal text-slate-500 normal-case">Default: K8s Event View</span>
			</div>
			<div class="evnt-feed" id="evntFeed">
				<div class="evnt-feed-empty">Connecting to database…</div>
			</div>
		</div>
		<div class="evnt-panel">
			<div class="evnt-panel-header">
				<span id="detailViewTitle">Detail Viewer</span>
			</div>
			<div class="evnt-feed" id="evntDetail">
				<div class="evnt-detail-empty">
					<svg class="w-6 h-6 text-gray-700 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
					<div class="text-xs font-bold text-gray-500">Select an incident to view details</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script>
	(function initEventsPage() {
		let events = [];
		let selectedId = null;
		let selectedMode = 'raw';
		let filterLevel = 'ALL';
		let searchQuery = '';
		let showInfoEvents = false;
		const stats = { CRITICAL: 0, WARNING: 0 };

		function timeAgo(ts) {
			const sec = Math.floor((Date.now() - new Date(ts)) / 1000);
			if (sec < 60) return sec + 's ago';
			if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
			return Math.floor(sec / 3600) + 'h ago';
		}

		function updateStats() {
			document.getElementById('evntStatCrit').textContent = stats.CRITICAL;
			document.getElementById('evntStatWarn').textContent = stats.WARNING;
		}

		function renderFeed() {
			const container = document.getElementById('evntFeed');
			if (!container) return;

			const filtered = events.filter(e => {
				if (!showInfoEvents && e.severity === 'INFO') return false;
				if (filterLevel !== 'ALL' && e.severity !== filterLevel) return false;
				if (searchQuery) {
					const q = searchQuery.toLowerCase();
					return (e.resource_name || '').toLowerCase().includes(q) ||
						(e.namespace || '').toLowerCase().includes(q) ||
						(e.summary || '').toLowerCase().includes(q) ||
						(e.reason || '').toLowerCase().includes(q);
				}
				return true;
			});

			if (filtered.length === 0) {
				container.innerHTML = '<div class="evnt-feed-empty">No matching incidents found</div>';
				return;
			}

			container.innerHTML = filtered.map(e => {
				const isSelectedRaw = e.incident_id === selectedId && selectedMode === 'raw';
				const isSelectedAi = e.incident_id === selectedId && selectedMode === 'ai';
				const wrapperClasses = `evnt-event ${e.severity} ${e._is_viewed ? 'checked' : ''} ${isSelectedRaw ? 'selected-raw selected' : ''} ${isSelectedAi ? 'selected-ai selected' : ''}`;
				
				return `
					<div class="${wrapperClasses}" onclick="window.evntCtrl.selectEvent('${e.incident_id}', 'raw')">
						<div class="evnt-unread-dot"></div>
						<div class="evnt-event-header">
							<span class="evnt-severity evnt-sev-${e.severity}">${e.severity}</span>
							<span class="evnt-event-time">${timeAgo(e.created_at)}</span>
						</div>
						<div class="evnt-event-resource">
							<span class="evnt-event-ns">${e.namespace}/</span>${e.resource_name}
						</div>
						<div class="evnt-event-message">${e.summary}</div>
						
						<div class="evnt-card-actions">
							<button class="evnt-btn-raw" onclick="event.stopPropagation(); window.evntCtrl.selectEvent('${e.incident_id}', 'raw')">Raw Event</button>
							<button class="evnt-btn-ai" onclick="event.stopPropagation(); window.evntCtrl.selectEvent('${e.incident_id}', 'ai')">
								<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
								AI Analysis
							</button>
						</div>

						<button class="evnt-delete-btn" onclick="window.evntCtrl.deleteEvent('${e.incident_id}', event)" title="Dismiss Notification">
							<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
						</button>
					</div>
				`;
			}).join('');
		}

		async function renderDetailRaw(evt) {
			const container = document.getElementById('evntDetail');
			document.getElementById('detailViewTitle').textContent = `Raw Event Details: ${evt.resource_name}`;
			
			const sevColor = evt.severity === 'CRITICAL' ? 'text-rose-400' : 'text-amber-400';
			const kvHtml = `
				<div class="evnt-section-title">Incident Metadata</div>
				<div class="evnt-kv-grid">
					<div class="evnt-kv-item"><span class="evnt-kv-key">Incident ID</span><span class="evnt-kv-val font-mono text-[10px] text-cyan-400">${evt.incident_id}</span></div>
					<div class="evnt-kv-item"><span class="evnt-kv-key">Severity</span><span class="evnt-kv-val ${sevColor} font-bold">${evt.severity}</span></div>
					<div class="evnt-kv-item"><span class="evnt-kv-key">Resource Kind</span><span class="evnt-kv-val text-slate-300">${evt.resource_type || '—'}</span></div>
					<div class="evnt-kv-item"><span class="evnt-kv-key">Resource Name</span><span class="evnt-kv-val text-white font-semibold">${evt.resource_name}</span></div>
					<div class="evnt-kv-item"><span class="evnt-kv-key">Namespace</span><span class="evnt-kv-val text-cyan-400">${evt.namespace}</span></div>
					<div class="evnt-kv-item"><span class="evnt-kv-key">Status</span><span class="evnt-kv-val text-slate-300">${evt.status}</span></div>
					<div class="evnt-kv-item"><span class="evnt-kv-key">Trigger Reason</span><span class="evnt-kv-val text-slate-300">${evt.reason || '—'}</span></div>
					<div class="evnt-kv-item"><span class="evnt-kv-key">Timestamp</span><span class="evnt-kv-val text-[11px]">${new Date(evt.created_at).toLocaleString()}</span></div>
				</div>
			`;

			container.innerHTML = `
				<div class="evnt-detail-body">
					${kvHtml}
					<div class="evnt-section-title">Live Kubernetes Events Feed</div>
					<div id="rawEventsContainer" class="animate-pulse text-xs font-bold text-gray-500 mt-4">Querying live cluster events...</div>
				</div>
			`;

			try {
				const rawEvents = await window.api.getResourceEvents(evt.resource_type || 'Pod', evt.resource_name, evt.namespace);
				const eventsContainer = document.getElementById('rawEventsContainer');
				
				if (!rawEvents || rawEvents.length === 0) {
					eventsContainer.className = "mt-2 p-4 border border-slate-800 rounded bg-slate-900/30 text-center";
					eventsContainer.innerHTML = `
						<div class="text-sm font-bold text-gray-400 mb-1">No Active Kubernetes Events</div>
						<div class="text-xs text-gray-500 max-w-sm mx-auto">The raw events for this resource have expired from the cluster's etcd buffer (usually 1 hour).</div>
					`;
					return;
				}

				eventsContainer.className = "mt-2";
				eventsContainer.innerHTML = rawEvents.map(re => {
					const isWarn = re.type === 'Warning';
					const color = isWarn ? 'text-amber-400' : 'text-emerald-400';
					return `
						<div class="raw-event-item">
							<div class="raw-event-reason">
								<span class="${color} uppercase">${re.reason}</span>
								<span class="text-gray-500 font-normal text-[10px]">${re.last_time || re.event_time} (Seen ${re.count}x)</span>
							</div>
							<div class="raw-event-msg">${re.message}</div>
						</div>
					`;
				}).join('');

			} catch (err) {
				const eventsContainer = document.getElementById('rawEventsContainer');
				if (eventsContainer) {
					eventsContainer.className = "mt-2 text-rose-400 text-xs";
					eventsContainer.innerHTML = `Failed to fetch live events: ${err.message}`;
				}
			}
		}

		async function renderDetailAi(evt) {
			const container = document.getElementById('evntDetail');
			document.getElementById('detailViewTitle').textContent = `AI Diagnostics Dossier: ${evt.resource_name}`;
			
			const rootCause = evt.root_cause_analysis || {};
			const confPct = Math.round((rootCause.hypothesis_confidence || 0.5) * 100);

			let remediationHtml = '<div class="text-gray-500 italic text-xs">No explicit steps recommended.</div>';
			if (evt.remediation_plan && evt.remediation_plan.length) {
				remediationHtml = evt.remediation_plan.map(step => `
					<div class="evnt-remediation-step">
						<div class="evnt-step-number">${step.step_number || '-'}</div>
						<div>
							<div class="text-xs font-bold text-cyan-400 mb-0.5">Execute: ${step.action_type} on ${step.target_resource || 'target'}</div>
							<div class="text-xs text-gray-300 mb-1">${step.description}</div>
							<div class="text-[10px] text-gray-500"><strong class="text-gray-400">Why:</strong> ${step.why || step.rationale || ''}</div>
						</div>
					</div>
				`).join('<div class="h-2"></div>');
			}

			let diagnosticsHtml = '';
			if (evt.collected_diagnostics && Object.keys(evt.collected_diagnostics).length) {
				diagnosticsHtml = `
					<div>
						<div class="evnt-section-title">Automated Diagnostics Executed</div>
						<div class="evnt-diagnostics-grid">
							${Object.entries(evt.collected_diagnostics).map(([name, diag]) => `
								<div class="evnt-diag-card">
									<span class="evnt-diag-name">${name}</span>
									<span class="evnt-diag-status ${diag.success ? 'text-emerald-400' : 'text-rose-400'}">
										${diag.success ? 'OK' : 'ERR'}
									</span>
								</div>
							`).join('')}
						</div>
					</div>
				`;
			}

			container.innerHTML = `
				<div class="evnt-detail-body">
					<div>
						<div class="flex items-center justify-between mb-2">
							<span style="font-size:10px;font-family:monospace;color:#475569">ID: ${evt.incident_id}</span>
							<span class="text-[10px] font-bold uppercase text-cyan-400 px-2 py-0.5 rounded bg-cyan-950/20 border border-cyan-900/30">${evt.status}</span>
						</div>
						<div class="evnt-section-title">Automated Verdict</div>
						<h3 class="text-sm font-semibold text-slate-100 leading-normal">${evt.summary}</h3>
					</div>

					<div>
						<div class="evnt-section-title">Root Cause Assessment</div>
						<div class="bg-cyan-950/5 border border-cyan-900/20 rounded-lg p-3.5">
							<div class="flex items-center justify-between mb-2">
								<strong class="text-[10px] text-cyan-400 uppercase tracking-wider">Analysis</strong>
								<div class="text-[10px] text-gray-500">
									Confidence: <strong class="text-cyan-400">${confPct}%</strong>
									<div class="evnt-confidence-bar"><div class="evnt-confidence-fill" style="width:${confPct}%"></div></div>
								</div>
							</div>
							<div class="text-xs text-slate-200 font-bold mb-2 leading-relaxed">${rootCause.root_cause || 'Undetermined'}</div>
							<div class="text-[11px] text-gray-400 leading-relaxed border-t border-cyan-900/10 pt-2"><strong class="text-gray-300">Reasoning:</strong> ${rootCause.reasoning || 'No details provided.'}</div>
						</div>
					</div>

					<div>
						<div class="evnt-section-title">Remediation Blueprint</div>
						<div class="space-y-2">${remediationHtml}</div>
					</div>

					${evt.log_snapshot ? `
					<div>
						<div class="evnt-section-title">Scraped Log Snapshot</div>
						<pre class="evnt-log-snapshot">${evt.log_snapshot}</pre>
					</div>` : ''}

					${diagnosticsHtml}
				</div>
			`;
		}

		function setWsStatus(state) {
			const dot = document.getElementById('evntWsDot');
			const label = document.getElementById('evntWsStatus');
			if (!dot || !label) return;
			dot.className = 'evnt-ws-dot ' + state;
			const texts = { connected: 'Connected', error: 'Error', connecting: 'Connecting…', '': 'Disconnected' };
			label.textContent = texts[state] || 'Disconnected';
		}

		async function loadIncidentsFromDB() {
			try {
				const activeNamespace = window.api.getNamespace();
				const records = await window.api.getIncidentRecords(activeNamespace);
				events = records;
				stats.CRITICAL = events.filter(e => e.severity === 'CRITICAL').length;
				stats.WARNING = events.filter(e => e.severity === 'WARNING').length;
				updateStats();
				renderFeed();
			} catch (err) {
				const container = document.getElementById('evntFeed');
				if (container) container.innerHTML = `<div class="evnt-feed-empty text-rose-400">Failed to fetch database incidents</div>`;
			}
		}

		function connect(token) {
			const ws = window._globalWs;
			if (!ws) { setWsStatus('error'); return; }
			setWsStatus(ws.readyState === 1 ? 'connected' : 'connecting');

			loadIncidentsFromDB();
			window.addEventListener('namespace-changed', loadIncidentsFromDB);

			ws.addEventListener('message', (raw) => {
				try {
					const data = JSON.parse(raw.data);
					if (data.type === 'INCIDENT_LIVE') {
						const exists = events.some(e => e.incident_id === data.incident_id);
						if (!exists) {
							data._is_viewed = false; 
							events.unshift(data);
							if (data.severity !== 'INFO') {
								stats[data.severity] = (stats[data.severity] || 0) + 1;
								updateStats();
								window.showToast(`🚨 AI Incident: ${data.summary}`, "error");
							}
							renderFeed();
						}
					}
				} catch (e) {}
			});
		}

		window.evntCtrl = {
			connect,
			disconnect() {
				const dot = document.getElementById('evntWsDot');
				const label = document.getElementById('evntWsStatus');
				if (dot) dot.className = 'evnt-ws-dot';
				if (label) label.textContent = 'Disconnected';
			},
			setFilter(level, btn) {
				filterLevel = level;
				document.querySelectorAll('.evnt-filter-btn').forEach(b => b.classList.remove('active'));
				if (btn) btn.classList.add('active');
				renderFeed();
			},
			toggleInfo() {
				showInfoEvents = !showInfoEvents;
				const btn = document.getElementById('btnToggleInfo');
				if (showInfoEvents) {
					btn.classList.add('active');
					btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg> Hide INFO`;
				} else {
					btn.classList.remove('active');
					btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Show INFO`;
				}
				renderFeed();
			},
			setSearch(val) {
				searchQuery = val;
				renderFeed();
			},
			async selectEvent(id, mode) {
				selectedId = id;
				selectedMode = mode || 'raw';
				
				const evt = events.find(e => e.incident_id === id);
				if (evt && !evt._is_viewed) {
					evt._is_viewed = true;
					try { await window.api.markIncidentViewed(id); } catch(e) {}
				}
				
				renderFeed();

				if (selectedMode === 'raw') {
					renderDetailRaw(evt);
				} else {
					renderDetailAi(evt);
				}
			},
			async deleteEvent(id, evtObj) {
				if (evtObj) evtObj.stopPropagation();
				try {
					await window.api.dismissIncident(id);
					events = events.filter(e => e.incident_id !== id);
					stats.CRITICAL = events.filter(e => e.severity === 'CRITICAL').length;
					stats.WARNING = events.filter(e => e.severity === 'WARNING').length;
					updateStats();
					
					if (selectedId === id) {
						selectedId = null;
						document.getElementById('detailViewTitle').textContent = 'Detail Viewer';
						document.getElementById('evntDetail').innerHTML = `<div class="evnt-detail-empty"><svg class="w-6 h-6 text-gray-700 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><div class="text-xs font-bold text-gray-500">Select an incident to view details</div></div>`;
					}
					renderFeed();
					window.showToast('Incident dismissed permanently', 'info');
				} catch (err) {
					window.showToast(`Dismiss failed: ${err.message}`, 'error');
				}
			},
			async clearAll() {
				const activeNamespace = window.api.getNamespace();
				try {
					await window.api.dismissAllIncidents(activeNamespace);
					window.showToast('All incidents cleared for this view', 'info');
					events = [];
					stats.CRITICAL = stats.WARNING = 0;
					selectedId = null;
					updateStats();
					renderFeed();
					document.getElementById('detailViewTitle').textContent = 'Detail Viewer';
					const detail = document.getElementById('evntDetail');
					if (detail) detail.innerHTML = `<div class="evnt-detail-empty"><svg class="w-6 h-6 text-gray-700 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><div class="text-xs font-bold text-gray-500">Select an incident to view details</div></div>`;
				} catch (err) {
					window.showToast(`Clear failed: ${err.message}`, 'error');
				}
			}
		};
	})();
</script>
